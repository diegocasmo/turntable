name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check pull request
        if: github.event_name == 'pull_request'
        run: pnpm danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check types
        run: pnpm typecheck

      - name: Check lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Test production server
        run: pnpm test:smoke

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: pnpm test:e2e

  railway:
    name: Railway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: railway-ci-target
      cancel-in-progress: false
    env:
      RUN_RAILWAY_TEST: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Skip untrusted pull request
        if: env.RUN_RAILWAY_TEST != 'true'
        run: echo "The Railway check does not run for fork pull requests."

      - name: Check out the repository
        if: env.RUN_RAILWAY_TEST == 'true'
        uses: actions/checkout@v6

      - name: Set up pnpm
        if: env.RUN_RAILWAY_TEST == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: env.RUN_RAILWAY_TEST == 'true'
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        if: env.RUN_RAILWAY_TEST == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check the Railway target
        if: env.RUN_RAILWAY_TEST == 'true'
        run: pnpm test:railway
        env:
          RAILWAY_API_URL: ${{ vars.RAILWAY_API_URL }}
          RAILWAY_TEST_ENVIRONMENT_ID: ${{ vars.RAILWAY_TEST_ENVIRONMENT_ID }}
          RAILWAY_TEST_PROJECT_ID: ${{ vars.RAILWAY_TEST_PROJECT_ID }}
          RAILWAY_TEST_SERVICE_ID: ${{ vars.RAILWAY_TEST_SERVICE_ID }}
          RAILWAY_TEST_TOKEN: ${{ secrets.RAILWAY_TEST_TOKEN }}
