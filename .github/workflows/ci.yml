name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check pull request
        if: github.event_name == 'pull_request'
        run: pnpm danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check types
        run: pnpm typecheck

      - name: Check lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test production server
        run: pnpm test:build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: railway-ci-target
      cancel-in-progress: false
    env:
      RUN_E2E: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Skip untrusted pull request
        if: env.RUN_E2E != 'true'
        run: echo "E2E does not run for fork pull requests."

      - name: Check out the repository
        if: env.RUN_E2E == 'true'
        uses: actions/checkout@v6

      - name: Set up pnpm
        if: env.RUN_E2E == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: env.RUN_E2E == 'true'
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        if: env.RUN_E2E == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        if: env.RUN_E2E == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Create session secret
        if: env.RUN_E2E == 'true'
        run: |
          value="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64'))")"
          echo "::add-mask::$value"
          echo "SESSION_SECRET=$value" >> "$GITHUB_ENV"

      - name: Run E2E tests
        if: env.RUN_E2E == 'true'
        run: pnpm test:e2e
        env:
          APP_ORIGIN: http://127.0.0.1:3000
          RAILWAY_API_URL: ${{ vars.RAILWAY_API_URL }}
          RAILWAY_TEST_ENVIRONMENT_ID: ${{ vars.RAILWAY_TEST_ENVIRONMENT_ID }}
          RAILWAY_TEST_PROJECT_ID: ${{ vars.RAILWAY_TEST_PROJECT_ID }}
          RAILWAY_TEST_SERVICE_ID: ${{ vars.RAILWAY_TEST_SERVICE_ID }}
          RAILWAY_TEST_TOKEN: ${{ secrets.RAILWAY_TEST_TOKEN }}
